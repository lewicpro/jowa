<ion-header>
  <ion-navbar color="dark">
      <ion-buttons start>
    <button ion-button menuToggle>
      <ion-icon name="menu"></ion-icon>
    </button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-navbar>
</ion-header>


<ion-content style="background: rgb(118, 96, 227);">
    <ion-card  style="margin-right: 10px; margin-top:10px; box-shadow: 1px 5px 10px rgba(16, 20, 25, 0.5)">
      <div style="text-align:center; background:#232020; padding:20px; color: ghostwhite">Email</div>
        <ion-card-content style=" margin-top:50px;">
            <form #form="ngForm" >
                
                <ion-item style="background: rgba(234, 233, 233, 0.7); width: 100%;">
                    <ion-label >Service</ion-label>
                    <ion-select  interface="action-sheet">
                      <ion-option value="enable">Mass mailer</ion-option>
                      <ion-option value="mute">Single</ion-option>
                      <ion-option value="mute_week">Custom</ion-option>
                    </ion-select>
                </ion-item>
                <ion-item style="background: rgba(255,255,255,0); width: 100%;">
                    <ion-label floating style=" padding-left: 5px;">Email From</ion-label>
                    <ion-input style=" padding-left: 5px; background: rgba(234, 233, 233, 0.7); border-radius: 3px;" type="email" name="email"></ion-input>
                </ion-item>
                <ion-item style="background: rgba(255,255,255,0); width: 100%;">
                        <ion-label floating style=" padding-left: 5px;">Password</ion-label>
                        <ion-input style=" padding-left: 5px; background: rgba(234, 233, 233, 0.7); border-radius: 3px;" type="password" name="password"></ion-input>
                    </ion-item>

            
                
            </form>
        </ion-card-content>
    </ion-card>
    <div style="padding:5px"></div>
    <ion-card  style="margin-right: 10px; margin-top:10px; box-shadow: 1px 5px 10px rgba(16, 20, 25, 0.5)">
        <div style="text-align:center"></div>
          <ion-card-content style=" margin-top:50px;">
              <form #form="ngForm" >
                    <ion-item style="background: rgba(255,255,255,0); width: 100%;">
                            <ion-label floating style=" padding-left: 5px;">Subject</ion-label>
                            <ion-input style=" padding-left: 5px; background: rgba(234, 233, 233, 0.7); border-radius: 3px;" type="text" name="text"></ion-input>
                        </ion-item>
                  
                  <ion-item style="background: rgba(255,255,255,0); width: 100%;">
                      <ion-label style=" padding-left: 5px;" floating>Message</ion-label>
                      <ion-textarea style=" padding-left: 5px; background: rgba(234, 233, 233, 0.7); border-radius: 3px;"></ion-textarea>
                    </ion-item>
                  <ion-item style="background: rgba(255,255,255,0); padding:0.5px">
                      <input Name="whoa" style="font-size:10px; display: none" #fileInput   (change)="onfileSelected($event)" type="file">
                    <a (click)="fileInput.click()" style="cursor: pointer; font-size:10px;">Email File</a>
                    <button (click)="onUpload()" style="font-size:10px;">Upload</button>
                  </ion-item>
              
                  
              </form>
          </ion-card-content>
          <div style="text-align:center; background:#232020; padding:5px; color: ghostwhite"><button  ion-button style="width:100%; background: rgba(36, 36, 36, 0);" (click)= "redirect()" block>Submit</button></div>
          
      </ion-card>
          
</ion-content>
