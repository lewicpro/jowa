

<div class="d-flex justify-content-center">
  <mat-form-field style="width:40%">
  <input   matInput [(ngModel)]="filtertext" placeholder="Filter">
  </mat-form-field>
  
</div>

<!-- <button (click)="wow()">ddd</button> -->
<div class="animated fadeIn"  style=" padding-top:15px; border-top-left-radius:10px; background:rgba(138, 35, 35, 0.04); border-top-right-radius:10px; box-shadow:0 5px 5px 0 rgba(104, 103, 103, 0.5)" id="componentID">
 
  <h4 style="text-align: center; letter-spacing:8px; color:#666; font-weight:100;"> WATEJA WOTE NA KUMBUKUMBU </h4>
  <div style="max-height:400px; overflow:auto" >
  <table class="table table-sm table-bordered table-striped table-light" style=" overflow:hidden; " >
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Jina</th>
        <th scope="col">Simu</th>
        <th scope="col">Account no</th>
        <th scope="col">pin</th>
        <th scope="col">expire</th>
        <th scope="col">ofisi</th>
        <th scope="col">kata</th>
        <th scope="col">wilaya</th>
        <th scope="col">mkoa</th>
        <th scope="col">TSD</th>
      </tr>
    </thead>
    <tbody>
      <tr style="cursor:pointer" id="customers" *ngFor="let form of users | myfilter : filtertext; let i = index" style="overflow-x:scroll;" scrollX="true" (click)="onselected(form)">
        <td *ngIf="form.privs === 'Client'" nowrap scope="row">{{i*1 - 1*1}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.jina | titlecase}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.Simu}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap> {{form.Account_no}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.pin}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.expire}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.ofisi}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.kata}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.wilaya}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.mkoa}}</td>
        <td *ngIf="form.privs === 'Client'" nowrap>{{form.TSD}}</td>
      
        <td *ngIf="form.privs === 'Client'"> <i class="fas fa-arrow-down" style="cursor: alias;"></i></td>
      </tr>
      <!--<tr id="customers">-->
        <!--<td scope="row">2</td>-->
        <!--<td>BA</td>-->
        <!--<td>3</td>-->
        <!--<td><i class="fas fa-arrow-down" style="cursor: alias;"></i></td>-->
      <!--</tr>-->

        <!--<td>Accountancy</td>-->
        <!--<td>3</td>-->
        <!--<td><i class="fas fa-arrow-down" style="cursor: alias;"></i></td>-->
      <!--</tr>-->
    </tbody>
  </table>
  
</div>
</div>
