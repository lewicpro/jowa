

<div class="d-flex justify-content-center" style="padding-bottom:20px">
    <mat-card-actions style="background:#e1e1e1; text-align: center">
        <button class="butto" style="width:auto; font-weight: 300;" (click)="ongeza()" mat-button>Ongeza Chumba</button>
        <button class="butto" style="font-weight: 300;" mat-button>Details za vyumba</button>
      </mat-card-actions>
</div>
<div class="animated fadeIn"  style=" padding-top:15px; border-top-left-radius:10px; background:rgba(138, 35, 35, 0.04); border-top-right-radius:10px; box-shadow:0 5px 5px 0 rgba(104, 103, 103, 0.5)">
  <h4 style="text-align: center; letter-spacing:8px; color:#666; font-weight:100;">VYUMBA VYOTE</h4>
  <div style="max-height:400px; overflow:auto">
  <table class="table table-sm table-bordered table-striped table-light" style=" overflow:hidden; " >
    <thead>
      <tr>
        <!-- <th scope="col">#</th> -->
        <th scope="col">Jina</th>
        <th scope="col">Simu</th>
        <th scope="col">namba ya chumba</th>
        <th scope="col">Eneo</th>
        <th scope="col">kulipia</th>
        <th scope="col">Chumba number</th>
        
        <!-- <th scope="col">ofisi</th> -->
        <th scope="col">kata</th>
        <th scope="col">wilaya</th>
        <th scope="col">mkoa</th>
     
      </tr>
    </thead>
    <tbody>
  
      <tr style="cursor:pointer" id="customers" *ngFor="let form of users | myfilter : filtertext" (click)="onselected(form)">
        <!-- <td scope="row">1</td> -->
        
        <td *ngIf="form.name === name">{{form.name | titlecase}}</td>
        <td *ngIf="form.name === name">{{form.simu}}</td>
        <td *ngIf="form.name === name">{{form.nyumba_number}}</td>
        <td *ngIf="form.name === name">{{form.ukubwa}}</td>
        <td *ngIf="form.name === name">{{form.Bei}}</td>
        <td *ngIf="form.name === name">{{form.Chumba_No}}</td>
       
        <!-- <td>{{form.ofisi}}</td> -->
        <td *ngIf="form.name === name">{{form.kata}}</td>
        <td *ngIf="form.name === name">{{form.wilaya}}</td>
        <td *ngIf="form.name === name">{{form.mkoa}}</td>

      
 
      </tr>

  </table>
  
</div>
