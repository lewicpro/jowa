<div class="animated fadeIn"  style=" padding-top:15px; border-top-left-radius:10px; background:rgba(132, 106, 106, 0.04); border-top-right-radius:10px; box-shadow:0 5px 5px 0 rgba(104, 103, 103, 0.5); overflow:scroll;">

  <ng-template #template>
    <div class="modal-body text-center">
      <p>Do you want to confirm?</p>
      <button type="button" class="btn btn-default" (click)="confirm()" >Yes</button>
      <button type="button" class="btn btn-primary" (click)="decline()" >No</button>
    </div>
  </ng-template>

        <th nowrap scope="col" title="Action">Transactions id</th>
        <th nowrap scope="col" title="Action"></th>
        
      </tr>
    </thead>

            <td><input type="number" style="border-radius:3px;"></td>
            <td><a (click)="PostData()"  >Tunza</a></td>
