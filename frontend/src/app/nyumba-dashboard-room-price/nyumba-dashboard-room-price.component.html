</div>
<div class="animated fadeIn"  style=" padding-top:15px; border-top-left-radius:10px; background:rgba(138, 35, 35, 0.04); border-top-right-radius:10px; box-shadow:0 5px 5px 0 rgba(104, 103, 103, 0.5);">
  <h4 style="text-align: center; letter-spacing:8px; color:#666; font-weight:100;">Prices</h4>
  <!-- <button type="button" class="btn btn-primary" (click)="openModal(template)">Open modal</button> -->
  <!-- <br><br> -->
  <!-- <pre class="card card-block card-header">{{message}}</pre> -->
  <ng-template #template>
    <div class="modal-body text-center">
      <p>Do you want to confirm?</p>
      <button type="button" class="btn btn-default" (click)="confirm()" >Yes</button>
      <button type="button" class="btn btn-primary" (click)="decline()" >No</button>
    </div>
  </ng-template>
  
  <table class="table table-sm table-bordered table-striped table-light" style=" overflow:hidden; " >
    <thead>
      <tr>
        <th scope="col">Tarehe</th>
        <th scope="col" title="Date">Jina</th>
        <th scope="col" title="Total Payment (L+I+6)">Jumla ya Kodi</th>
        <th scope="col" title="Loan Repayment">Kipindi</th>
        <th scope="col" title="Interest Paid">Deni</th>
        <th scope="col" title="(Mkopo + Riba) Balance">Daily</th>
        <th scope="col" title="(Mkopo + Riba) Balance">Status</th>
        <th scope="col" title="Action">Action</th>
        
      </tr>
    </thead>
    <tbody >
      <!-- <div >
        <div *ngIf="k.user ==='Lewicpro'">{{k.user}}</div>
        
      </div> -->
        <tr style="cursor:pointer" id="customers">
            <td class="text-center" ><input   style="border-radius:3px;"  type="text" placeholder="Muda wa sasa"> </td>
            <td style="white-space: nowrap">{{jinalote}}</td>
            <td><input [(ngModel)]="Rent_budget"  style="border-radius:3px;" name="Rent_budget"  type="number" placeholder="*Important"></td>
            <td><input [(ngModel)]="Time_interval" type="text" style="border-radius:3px;" name="Time_interval"></td>
            <td><input disabled  style="border-radius:3px; background: rgb(218, 217, 217)" type="text"  name="user"></td>
            <td><input disabled  style="border-radius:3px; background: rgb(218, 217, 217)" type="text"  name="user"></td>
            <td><input disabled  [(ngModel)]="Daily"  style="border-radius:3px; background: rgb(218, 217, 217)"  type="number"></td>
            <td><a (click)="postRent()"  >Tunza</a></td>
          </tr>
      <tr  id="customers" *ngFor="let k of all" >
          
        <td Sikus> {{k.date | date}}</td>
        <td Sikus style="white-space: nowrap">{{k.user}}</td>
        <td Sikus style="white-space: nowrap">{{k.Rent_budget}}</td>
        <td Sikus style="white-space: nowrap">{{k.Time_interval}}</td>
        <td style="white-space: nowrap; ">{{k.Deni}}</td>
        <!-- <td *ngIf="k.rangi ==='blue' "   style ="color:blue"><a (click)="takepdf(k)">{{k.Balance | currency: 'tsh '}}</a></td> -->
        <td  style="color:red">{{k.Daily | currency: 'tsh '}}</td>
        <td  style="color:red">{{k.status}}</td>
        <!-- <td *ngIf="k.user === username "  style="color:red"></td> -->

        <td   style="color:red" ></td>
        

      </tr>

  </table>
