  <div class="animated fadeIn"  style=" padding-top:15px; border-top-left-radius:10px; background:rgba(138, 35, 35, 0.04); border-top-right-radius:10px; box-shadow:0 5px 5px 0 rgba(104, 103, 103, 0.5)">
    <h4 style="text-align: center; letter-spacing:8px; color:#666; font-weight:100;"> WAMILIKI WA MADUKA</h4>
    <div style="max-height:400px; overflow:auto">
    <table class="table table-sm table-bordered table-striped table-light" style=" overflow:hidden; " >
      <thead>
        <tr>
          <!-- <th scope="col">#</th> -->
          <th scope="col">Jina</th>
          <th scope="col">Simu</th>
          <th scope="col">Email</th>
          <th scope="col">Account</th>
          <th scope="col">company</th>
          <th scope="col">Tin</th>
          <!-- <th scope="col">ofisi</th> -->
          <th scope="col">kata</th>
          <th scope="col">wilaya</th>
          <th scope="col">mkoa</th>

        </tr>
      </thead>
      <tbody>
        <tr style="cursor:pointer" id="customers" *ngFor="let form of users | myfilter; let i = index" (click)="onselected(form)">
          <!-- <td scope="row">{{i*1 + 1*1}}</td> -->
          <td nowrap>{{form.jina | titlecase}}</td>
          <td nowrap>{{form.Simu}}</td>
          <td nowrap>{{form.Email}}</td>
          <td nowrap>{{form.Account_no}} : {{form.name_of_the_bank}}</td>
          <td nowrap>{{form.company}}</td>
          <td nowrap>{{form.Tin_no}}</td>

          <!-- <td>{{form.ofisi}}</td> -->
          <td nowrap>{{form.kata | titlecase}}</td>
          <td nowrap>{{form.wilaya | titlecase}}</td>
          <td nowrap>{{form.mkoa | titlecase}}</td>



        </tr>

      </tbody>
    </table>

  </div>
